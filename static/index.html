<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluetooth Scanner</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus"></script>
    <style>
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .scanning-indicator {
            animation: pulse 2s infinite;
        }
        .manufacturer-details {
            max-height: 200px;
            overflow-y: auto;
        }
        .device-table {
            width: 100%;
        }
        .device-table .el-table__body-wrapper {
            overflow-x: auto;
        }
        .rssi-cell {
            font-weight: bold;
            font-size: 16px;
        }
        .address-cell {
            font-family: monospace;
            font-size: 12px;
        }
        .device-type-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .expanded-details {
            background-color: #fafafa;
            padding: 16px;
            border: 1px solid #e4e7ed;
            border-radius: 4px;
            margin: 8px 0;
        }
        .beacon-details {
            background-color: #f5f7fa;
            padding: 12px;
            border-radius: 4px;
            margin: 8px 0;
        }
        .raw-data {
            font-family: monospace;
            word-break: break-all;
            background-color: #f5f7fa;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        @media (max-width: 768px) {
            .device-table .el-table__body-wrapper {
                overflow-x: scroll;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <el-container>
            <el-main>
                <div style="max-width: 1200px; margin: 0 auto; padding: 20px;">
                    <!-- Header -->
                    <el-card class="mb-4">
                        <h1 style="font-size: 24px; margin-bottom: 16px;">Bluetooth Scanner</h1>
                        
                        <!-- Control Panel -->
                        <el-row :gutter="20" align="middle">
                            <el-col :span="6">
                                <el-button 
                                    :type="scanning ? 'danger' : 'primary'"
                                    :loading="loading"
                                    @click="toggleScan"
                                >
                                    {{ scanning ? 'Stop Scan' : 'Start Scan' }}
                                </el-button>
                            </el-col>
                            
                            <el-col :span="12">
                                <div v-if="scanning" style="display: flex; align-items: center; gap: 8px;">
                                    <div class="scanning-indicator" style="width: 12px; height: 12px; background-color: #409EFF; border-radius: 50%;"></div>
                                    <span>Scanning for devices...</span>
                                </div>
                            </el-col>
                            
                            <el-col :span="6" style="text-align: right;">
                                <span>Devices found: </span>
                                <el-tag>{{ Object.keys(devices).length }}</el-tag>
                            </el-col>
                        </el-row>
                        
                        <!-- WebSocket Status -->
                        <div style="margin-top: 16px;">
                            <el-text :type="wsConnected ? 'success' : 'danger'">
                                Connection: {{ wsConnected ? 'Connected' : 'Disconnected' }}
                            </el-text>
                        </div>
                        
                        <!-- Device Type Statistics -->
                        <el-row v-if="Object.keys(devices).length > 0" :gutter="20" style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #E4E7ED;">
                            <el-col :span="6" style="text-align: center;">
                                <el-statistic title="iBeacons" :value="getDeviceCountByType('ibeacon')" />
                            </el-col>
                            <el-col :span="6" style="text-align: center;">
                                <el-statistic title="Eddystone" :value="getDeviceCountByType('eddystone')" />
                            </el-col>
                            <el-col :span="6" style="text-align: center;">
                                <el-statistic title="AirPods" :value="getDeviceCountByType('airpods')" />
                            </el-col>
                            <el-col :span="6" style="text-align: center;">
                                <el-statistic title="Others" :value="Object.keys(devices).length - getDeviceCountByType('ibeacon') - getDeviceCountByType('eddystone') - getDeviceCountByType('airpods')" />
                            </el-col>
                        </el-row>
                    </el-card>
                    
                    <!-- Filter and Sort -->
                    <el-card class="mb-4">
                        <el-row :gutter="20">
                            <el-col :span="8">
                                <el-input 
                                    v-model="filter.name"
                                    placeholder="🔍 Filter by name..."
                                    clearable
                                />
                            </el-col>
                            <el-col :span="8">
                                <el-input-number 
                                    v-model="filter.minRssi"
                                    :min="-120"
                                    :max="0"
                                    placeholder="Min RSSI"
                                    style="width: 100%;"
                                />
                            </el-col>
                            <el-col :span="8">
                                <el-select v-model="sortBy" placeholder="Sort by" style="width: 100%;">
                                    <el-option label="Signal Strength" value="rssi" />
                                    <el-option label="Name" value="name" />
                                    <el-option label="Discovery Time" value="discovered" />
                                    <el-option label="Distance (Beacons)" value="distance" />
                                </el-select>
                            </el-col>
                        </el-row>
                    </el-card>
                    
                    <!-- Device Table -->
                    <el-table 
                        :data="filteredAndSortedDevices" 
                        class="device-table"
                        stripe
                        :default-sort="{ prop: 'rssi', order: 'descending' }"
                        @sort-change="handleSort"
                    > <!-- row-key="row => row.address || row.timestamp || Math.random()" -->
                        <!-- Expandable Details -->
                        <el-table-column type="expand">
                            <template #default="{ row }">
                                <div class="expanded-details">
                                    <!-- Manufacturer Details -->
                                    <div v-if="row.decoded_manufacturer && Object.keys(row.decoded_manufacturer).length > 0">
                                        <h4>Manufacturer Information</h4>
                                        <div v-for="(mfgData, companyId) in row.decoded_manufacturer" :key="row.address + '-' + companyId" class="beacon-details">
                                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                                <el-text strong>{{ mfgData.company_name }}</el-text>
                                                <el-text type="info" size="small">ID: 0x{{ parseInt(companyId).toString(16).padStart(4, '0').toUpperCase() }}</el-text>
                                            </div>
                                            
                                            <!-- iBeacon Details -->
                                            <div v-if="mfgData?.type === 'ibeacon'">
                                                <el-descriptions :column="2" size="small" border>
                                                    <el-descriptions-item label="UUID">{{ mfgData.uuid }}</el-descriptions-item>
                                                    <el-descriptions-item label="Major">{{ mfgData.major || 0 }}</el-descriptions-item>
                                                    <el-descriptions-item label="Minor">{{ mfgData.minor || 0 }}</el-descriptions-item>
                                                    <!-- <el-descriptions-item v-if="typeof mfgData.estimated_distance === 'number'" label="Distance">
                                                        <el-text type="primary">
                                                            📍 ~{{ mfgData.estimated_distance.toFixed(1) }} meters
                                                        </el-text>
                                                    </el-descriptions-item> -->
                                                </el-descriptions>
                                            </div>
                                            
                                            <!-- Eddystone Details -->
                                            <div v-if="mfgData?.type === 'eddystone'">
                                                <el-descriptions :column="2" size="small" border>
                                                    <el-descriptions-item label="Frame Type">{{ mfgData.frame_type }}</el-descriptions-item>
                                                    <el-descriptions-item v-if="mfgData.url" label="URL">
                                                        <el-link :href="mfgData.url" target="_blank" type="primary">{{ mfgData.url }}</el-link>
                                                    </el-descriptions-item>
                                                </el-descriptions>
                                            </div>
                                            
                                            <!-- AirPods Details -->
                                            <div v-if="mfgData?.type === 'airpods'">
                                                <el-descriptions :column="2" size="small" border>
                                                    <el-descriptions-item v-if="mfgData.model" label="Model">{{ mfgData.model }}</el-descriptions-item>
                                                    <el-descriptions-item v-if="mfgData.left_battery !== null" label="Left Battery">
                                                        <el-tag size="small" :type="mfgData.left_battery < 20 ? 'danger' : 'info'">
                                                            {{ mfgData.left_battery }}%
                                                        </el-tag>
                                                    </el-descriptions-item>
                                                    <el-descriptions-item v-if="mfgData.right_battery !== null" label="Right Battery">
                                                        <el-tag size="small" :type="mfgData.right_battery < 20 ? 'danger' : 'info'">
                                                            {{ mfgData.right_battery }}%
                                                        </el-tag>
                                                    </el-descriptions-item>
                                                    <el-descriptions-item v-if="mfgData.case_battery !== null" label="Case Battery">
                                                        <el-tag size="small" :type="mfgData.case_battery < 20 ? 'danger' : 'info'">
                                                            {{ mfgData.case_battery }}%
                                                        </el-tag>
                                                    </el-descriptions-item>
                                                    <el-descriptions-item v-if="mfgData.charging" label="Charging">
                                                        <el-text type="success">🔌 Yes</el-text>
                                                    </el-descriptions-item>
                                                </el-descriptions>
                                            </div>
                                            
                                            <!-- Raw Data -->
                                            <div v-if="mfgData.raw_hex" style="margin-top: 12px;">
                                                <el-text strong size="small">Raw Data ({{ mfgData.raw_length || 0 }} bytes):</el-text>
                                                <div class="raw-data">{{ mfgData.raw_hex }}</div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <!-- Connection Actions -->
                                    <div style="margin-top: 16px;">
                                        <el-space>
                                            <el-button 
                                                size="small"
                                                :type="row.connected ? 'success' : 'primary'"
                                                :loading="row.connecting"
                                                :disabled="row.connected"
                                                @click="connectDevice(row.address)"
                                            >
                                                {{ row.connected ? 'Connected' : row.connecting ? 'Connecting...' : 'Connect' }}
                                            </el-button>
                                            <el-button 
                                                size="small"
                                                :disabled="!row.connected"
                                                @click="getServices(row.address)"
                                            >
                                                Discover Services
                                            </el-button>
                                        </el-space>
                                    </div>
                                    
                                    <!-- Services -->
                                    <div v-if="row.services && row.services.length > 0" style="margin-top: 16px;">
                                        <h4>Services</h4>
                                        <div class="manufacturer-details">
                                            <div v-for="service in row.services" :key="service.uuid" class="beacon-details">
                                                <el-text size="small" style="font-family: monospace; display: block;">{{ service.uuid }}</el-text>
                                                <el-text type="info" size="small">{{ service.characteristics.length }} characteristics</el-text>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </el-table-column>
                        
                        <!-- Device Name -->
                        <el-table-column prop="name" label="Device Name" min-width="150" sortable>
                            <template #default="{ row }">
                                <div>
                                    <el-text strong>{{ row.name || 'Unknown Device' }}</el-text>
                                    <br>
                                    <el-text type="info" size="small" class="address-cell">{{ row.address }}</el-text>
                                </div>
                            </template>
                        </el-table-column>
                        
                        <!-- RSSI -->
                        <el-table-column prop="rssi" label="Signal" width="120" sortable>
                            <template #default="{ row }">
                                <div style="text-align: center;">
                                    <div class="rssi-cell" :style="{ color: getRssiColor(row.rssi) }">
                                        {{ row.rssi }} dBm
                                    </div>
                                    <el-tag size="small" :type="getRssiType(row.rssi)">
                                        {{ getRssiStrength(row.rssi) }}
                                    </el-tag>
                                </div>
                            </template>
                        </el-table-column>
                        
                        <!-- Manufacturer -->
                        <el-table-column label="Manufacturer" min-width="150">
                            <template #default="{ row }">
                                <div v-if="row.decoded_manufacturer && Object.keys(row.decoded_manufacturer).length > 0">
                                    <div v-for="(mfgData, companyId) in row.decoded_manufacturer" :key="companyId">
                                        <el-text size="small">{{ mfgData.company_name }}</el-text>
                                    </div>
                                </div>
                                <el-text v-else type="info" size="small">Unknown</el-text>
                            </template>
                        </el-table-column>
                        
                        <!-- Device Type -->
                        <el-table-column label="Type" width="120">
                            <template #default="{ row }">
                                <div class="device-type-tags">
                                    <template v-for="(mfgData, companyId) in row.decoded_manufacturer" :key="companyId">
                                        <el-tag
                                            v-if="mfgData?.type"
                                            size="small"
                                            :type="getDeviceTypeTagType(mfgData.type)"
                                        >
                                            {{ mfgData.type.toUpperCase() }}
                                        </el-tag>
                                    </template>
                                    <el-text
                                        v-if="!Object.values(row.decoded_manufacturer || {}).some(m => m.type)"
                                        type="info"
                                        size="small"
                                        >
                                        Generic
                                    </el-text>
                                </div>
                            </template>
                        </el-table-column>
                        
                        <!-- Last Seen -->
                        <el-table-column prop="timestamp" label="Last Seen" width="100" sortable>
                            <template #default="{ row }">
                                <el-text size="small">{{ formatTime(row.timestamp) }}</el-text>
                            </template>
                        </el-table-column>
                        
                        <!-- Connection Status -->
                        <el-table-column label="Status" width="100">
                            <template #default="{ row }">
                                <el-tag v-if="row.connected" type="success" size="small">Connected</el-tag>
                                <el-tag v-else-if="row.connecting" type="warning" size="small">Connecting</el-tag>
                                <el-tag v-else type="info" size="small">Available</el-tag>
                            </template>
                        </el-table-column>
                    </el-table>
                    
                    <!-- Empty State -->
                    <el-empty v-if="Object.keys(devices).length === 0" description="No devices discovered yet">
                        <el-button type="primary" @click="startScan" :loading="loading">Start Scanning</el-button>
                    </el-empty>
                </div>
            </el-main>
        </el-container>
        
        <!-- Error Notification handled by Element Plus -->
    </div>
    
    <script>
        const { createApp } = Vue;
        
        
        const app = createApp({
            data() {
                return {
                    devices: {},
                    showConnectedOnly: false,
                    sortOrder: "rssi",
                    scanning: false,
                    loading: false,
                    wsConnected: false,
                    ws: null,
                    error: null,
                    filter: {
                        name: '',
                        minRssi: -100
                    },
                    sortBy: 'rssi'
                };
            },
            
            computed: {
                filteredAndSortedDevices() {
                return Object.values(this.devices)
                    .filter(device => device.address)   // ✅ guard
                    .filter(device => {
                        return (
                            (!this.filter.name || (device.name || '').toLowerCase().includes(this.filter.name.toLowerCase())) &&
                            (device.rssi >= this.filter.minRssi) &&
                            (this.showConnectedOnly ? device.connected : true)
                        );
                    })
                    .sort((a, b) => {
                        return this.sortOrder === 'rssi'
                            ? b.rssi - a.rssi
                            : a.address.localeCompare(b.address);
                    });
                }
            },
            
            mounted() {
                this.connectWebSocket();
                this.checkScanStatus();
            },
            
            methods: {
                handleSort({ column, prop, order }) {
                    // Handle custom sorting for distance column
                    if (prop === 'rssi') {
                        this.sortBy = 'rssi';
                    } else if (prop === 'name') {
                        this.sortBy = 'name';
                    } else if (prop === 'timestamp') {
                        this.sortBy = 'discovered';
                    }
                },
                
                connectWebSocket() {
                    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                    const wsUrl = `${protocol}//${window.location.host}/ws`;
                    
                    this.ws = new WebSocket(wsUrl);
                    
                    this.ws.onopen = () => {
                        this.wsConnected = true;
                        console.log('WebSocket connected');
                    };
                    
                    this.ws.onmessage = (event) => {
                        const message = JSON.parse(event.data);
                        this.handleWebSocketMessage(message);
                    };
                    
                    this.ws.onclose = () => {
                        this.wsConnected = false;
                        console.log('WebSocket disconnected');
                        setTimeout(() => this.connectWebSocket(), 3000);
                    };
                    
                    this.ws.onerror = (error) => {
                        console.error('WebSocket error:', error);
                    };
                },
                
                handleWebSocketMessage(message) {
                    switch (message.type) {
                        case 'device_created':
                        case 'device_discovered':
                            this.addOrUpdateDevice(message.data);
                            break;
                        case 'device_updated':
                            const { address, changes, timestamp } = message.data;
                            this.addOrUpdateDevice(
                                {
                                    address: address,
                                    timestamp: new Date(timestamp).toISOString(),
                                    ...changes,
                                }
                            );
                            break;
                        case 'scan_started':
                            this.scanning = true;
                            break;
                        case 'scan_stopped':
                            this.scanning = false;
                            break;
                        case 'device_connected':
                            this.updateDeviceStatus(message.data.address, { connected: true, connecting: false });
                            break;
                        case 'device_disconnected':
                            this.updateDeviceStatus(message.data.address, { connected: false });
                            break;
                    }
                },
                
                async checkScanStatus() {
                    try {
                        const response = await fetch('/api/v1/scan/status');
                        const data = await response.json();
                        this.scanning = data.is_scanning;
                    } catch (error) {
                        console.error('Failed to check scan status:', error);
                    }
                },
                
                async toggleScan() {
                    if (this.scanning) {
                        await this.stopScan();
                    } else {
                        await this.startScan();
                    }
                },
                
                async startScan() {
                    this.loading = true;
                    this.error = null;
                    
                    try {
                        const response = await fetch('/api/v1/scan/start', {
                            method: 'POST'
                        });
                        
                        if (!response.ok) {
                            throw new Error('Failed to start scan');
                        }
                        
                        this.scanning = true;
                        this.devices = {};
                    } catch (error) {
                        this.$message.error('Failed to start scan');
                        console.error(error);
                    } finally {
                        this.loading = false;
                    }
                },
                
                async stopScan() {
                    this.loading = true;
                    this.error = null;
                    
                    try {
                        const response = await fetch('/api/v1/scan/stop', {
                            method: 'POST'
                        });
                        
                        if (!response.ok) {
                            throw new Error('Failed to stop scan');
                        }
                        
                        this.scanning = false;
                    } catch (error) {
                        this.$message.error('Failed to stop scan');
                        console.error(error);
                    } finally {
                        this.loading = false;
                    }
                },
                
                addOrUpdateDevice(deviceData) {
                    const device = {
                        address: deviceData.address,
                        ...deviceData,
                        timestamp: new Date(deviceData.timestamp).toISOString(),
                        decoded_manufacturer: {
                            ...(this.devices[deviceData.address]?.decoded_manufacturer || {}),
                            ...(deviceData.decoded_manufacturer || {})
                        },
                        showDetails: this.devices[deviceData.address]?.showDetails || false,
                        connected: this.devices[deviceData.address]?.connected || false,
                        connecting: this.devices[deviceData.address]?.connecting || false,
                        services: this.devices[deviceData.address]?.services || []
                    };
                    
                    this.devices = {
                        ...this.devices,
                        [device.address]: device
                    };
                },
                
                updateDeviceStatus(address, status) {
                    if (this.devices[address]) {
                        Object.assign(this.devices[address], status);
                    }
                },
                
                async connectDevice(address) {
                    this.updateDeviceStatus(address, { connecting: true });
                    this.error = null;
                    
                    try {
                        const response = await fetch(`/api/v1/devices/${address}/connect`, {
                            method: 'POST'
                        });
                        
                        if (!response.ok) {
                            throw new Error('Failed to connect');
                        }
                    } catch (error) {
                        this.$message.error(`Failed to connect to ${address}`);
                        this.updateDeviceStatus(address, { connecting: false });
                    }
                },
                
                async getServices(address) {
                    this.error = null;
                    
                    try {
                        const response = await fetch(`/api/v1/devices/${address}/services`);
                        
                        if (!response.ok) {
                            throw new Error('Failed to get services');
                        }
                        
                        const data = await response.json();
                        this.devices[address].services = data.services;
                    } catch (error) {
                        this.$message.error(`Failed to get services for ${address}`);
                    }
                },
                
                getRssiColor(rssi) {
                    if (rssi >= -50) return '#67C23A';
                    if (rssi >= -70) return '#E6A23C';
                    if (rssi >= -85) return '#F56C6C';
                    return '#F56C6C';
                },
                
                getRssiType(rssi) {
                    if (rssi >= -50) return 'success';
                    if (rssi >= -70) return 'warning';
                    return 'danger';
                },
                
                getRssiStrength(rssi) {
                    if (rssi >= -50) return 'Excellent';
                    if (rssi >= -70) return 'Good';
                    if (rssi >= -85) return 'Fair';
                    return 'Weak';
                },
                
                formatTime(timestamp) {
                    const date = new Date(timestamp);
                    return date.toLocaleTimeString();
                },
                
                getDeviceCountByType(type) {
                    return Object.values(this.devices).filter(device => 
                        Object.values(device.decoded_manufacturer || {}).some(mfg => mfg.type === type)
                    ).length;
                },
                
                getDeviceTypeTagType(type) {
                    switch (type) {
                        case 'ibeacon': return 'primary';
                        case 'eddystone': return 'success';
                        case 'airpods': return 'warning';
                        default: return 'info';
                    }
                }
            }
        });
        
        app.use(ElementPlus);
        app.mount('#app');

        app.config.errorHandler = (err) => {
            /* handle error */
            console.error(err);
        };

    </script>
</body>
</html>
